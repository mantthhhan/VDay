<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be My Valentine</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="hearts-bg" aria-hidden="true"></div>

    <main class="card">
      <h1 class="headline">Hey Sweetie, will you be my valentine?</h1>

      <div class="buttons" id="buttonArea">
        <button id="yesBtn" class="btn yes">Yes ❤️</button>
        <button id="noBtn" class="btn no">No 💔</button>
      </div>

      <div id="result" class="result" hidden>
        <p class="result-text">Yay! You just made my day ❤️ Happy Valentine’s Day!</p>
      </div>

      <p class="banter" id="banter">"No" is a little shy! 😳</p>

      <audio id="bgMusic" loop crossorigin="anonymous">
        <!-- Optional: drop a music file into assets/music.mp3 and uncomment the source below -->
        <!-- <source src="assets/music.mp3" type="audio/mpeg"> -->
      </audio>
    </main>

    <div id="confetti"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
